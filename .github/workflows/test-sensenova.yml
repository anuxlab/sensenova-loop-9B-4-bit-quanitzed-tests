# .github/workflows/test-sensenova.yml
name: Test SenseNova Loop-9B on CPU

on:
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab
  push:
    branches: [ main ]

jobs:
  inference-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # Model download and CPU inference can be slow

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Transformers 5.18.0 is verified on Python 3.11

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-sensenova-loop-9b
          restore-keys: |
            ${{ runner.os }}-hf-sensenova-loop-9b

      - name: Run inference test
        run: python test_model.py
        env:
          # Helps reduce memory fragmentation on CPU
          OMP_NUM_THREADS: 4
          MKL_NUM_THREADS: 4
