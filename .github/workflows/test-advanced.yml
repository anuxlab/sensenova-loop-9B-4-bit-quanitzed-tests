# .github/workflows/test-advanced.yml
name: Test SenseNova Loop-9B (Advanced)

on:
  workflow_dispatch:
    inputs:
      tests:
        description: 'Which tests to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - thinking
          - multimodal
          - longcontext

jobs:
  advanced-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # thinking mode + long context can be slow on CPU

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Cache Hugging Face model
        id: hf-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-sensenova-loop-9b
          restore-keys: |
            ${{ runner.os }}-hf-sensenova-loop-9b

      - name: Report cache status
        run: |
          echo "Cache hit: ${{ steps.hf-cache.outputs.cache-hit }}"
          du -sh ~/.cache/huggingface 2>/dev/null || echo "No cache yet"

      - name: Run advanced tests
        run: python test_advanced.py --tests "${{ inputs.tests }}"
        env:
          OMP_NUM_THREADS: 4
          MKL_NUM_THREADS: 4
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TRANSFORMERS_VERBOSITY: info
