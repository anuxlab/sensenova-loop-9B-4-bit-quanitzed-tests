# .github/workflows/test-basic.yml
name: Test SenseNova Loop-9B (Basic)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  inference-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Cache Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-sensenova-loop-9b
          restore-keys: |
            ${{ runner.os }}-hf-sensenova-loop-9b

      - name: Run basic inference test
        run: python test_model.py
        env:
          OMP_NUM_THREADS: 4
          MKL_NUM_THREADS: 4
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
